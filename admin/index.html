<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来过之地 · 作者工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/author/admin.css"></head><body class="studio">
<header class="studio-header"><a class="wordmark" href="/" target="_blank" rel="noopener">来过之地<span>THE EDITING ROOM</span></a><span class="workspace-label">作者工作台 <span class="local-badge">私人空间</span></span><div class="header-actions"><span id="save-state" role="status">草稿已保存</span><a href="/" target="_blank" rel="noopener" class="button">预览发布版</a><button id="publish" class="primary">生成发布版</button></div></header>
<main class="workspace"><aside class="left-panel"><section class="asset-panel"><div class="panel-title"><h2>素材库 <span id="asset-count">00</span></h2><label class="upload-button" for="upload">＋ 导入<input id="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div><p class="section-hint">原图保存在私人存储，点击加入摄影集</p><div id="assets" class="asset-grid"></div><div class="drop-hint" id="drop-hint">将照片拖入这里<br><span>JPEG / PNG / WebP · 最大 100 MB</span></div></section><section class="pages-panel"><div class="panel-title"><h2>页面 <span id="total-pages">00</span></h2><div><button id="add-chapter" class="tiny" title="添加章节">＋ 章节</button><button id="add-text" class="tiny" title="添加白页">＋ 白页</button></div></div><div id="thumbnails"></div></section></aside>
<section class="canvas-panel"><div class="canvas-toolbar"><span id="selection-label">单页排版</span><span>横向 A4 <i> / </i> 297 × 210</span></div><div class="canvas-wrap"><div id="page-canvas"></div><div id="empty-canvas"><span class="empty-number">01</span><h1>把第一张照片，<br>放进这本书。</h1><p>从左侧导入作品，或添加一张白页。</p><label for="upload" class="button">导入照片</label></div></div><div class="canvas-bottom"><span id="canvas-tip">留一些空白，让目光停留。</span><span id="page-position"></span></div></section>
<aside class="inspector"><div class="panel-title"><h2>页面设置</h2><span id="page-kind">—</span></div><div id="inspector-empty"><p>选中一页，开始排版。</p></div><div id="inspector-fields" hidden><section class="field-section"><h3><span>01</span> 基础信息</h3><label>作品名<input data-field="title" placeholder="未命名作品" maxlength="150"></label><div id="photo-fields"><div class="field-pair"><label>拍摄地点<input data-field="location" placeholder="地点" maxlength="150"></label><label>拍摄时间<input data-field="date" placeholder="例如 2026.09" maxlength="100"></label></div><div class="field-pair"><label>胶卷<input data-field="film" placeholder="例如 Kodak Gold 200" maxlength="150"></label><label>画幅<input data-field="format" placeholder="例如 135 / 6×7" maxlength="100"></label></div><label>内容简述<textarea data-field="description" placeholder="关于这个瞬间…" rows="3" maxlength="500"></textarea></label><p class="section-hint">未填写的信息不会出现在页面中。</p></div><div id="text-fields" hidden><label>正文<textarea data-field="text" rows="6" placeholder="写下章节序言，或让这一页保持空白。" maxlength="1200"></textarea></label><label>文字模板<select data-field="template"><option value="center">居中 · 扉页</option><option value="editorial">左对齐 · 序言</option><option value="bottom">左下角 · 随笔</option></select></label></div></section>
<section id="image-controls" class="field-section"><h3><span>02</span> 图像与构图</h3><label>画面尺寸</label><div class="segments" id="size-options"><button data-size="large">大 <small>80%+</small></button><button data-size="medium">中 <small>50%</small></button><button data-size="small">小 <small>30%</small></button></div><label>裁切比例<select id="crop-ratio"><option value="original">原始比例 · 不裁切</option><option value="1.5">3:2 横向</option><option value="0.666666667">2:3 竖向</option><option value="1.333333333">4:3 横向</option><option value="0.75">3:4 竖向</option><option value="1">1:1 方形</option><option value="1.166666667">7:6 横向</option><option value="0.857142857">6:7 竖向</option><option value="1.25">5:4 横向</option><option value="0.8">4:5 竖向</option><option value="2.708333333">65:24 宽幅</option><option value="1.777777778">16:9 宽幅</option><option value="2.35">2.35:1 宽银幕</option></select></label><label class="range-label">裁切缩放 <output id="crop-value">1.00×</output><input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label><div class="field-pair"><label>水平位置<input type="range" id="crop-x" min="0" max="1" step="0.005"></label><label>垂直位置<input type="range" id="crop-y" min="0" max="1" step="0.005"></label></div><div class="crop-footer"><span class="section-hint">也可在画面内拖动照片</span><button class="tiny" id="reset-crop">重置裁切</button></div></section>
<section class="field-section"><h3><span>03</span> 页面顺序</h3><div class="field-pair"><button class="button" id="move-up">↑ 上移一页</button><button class="button" id="move-down">↓ 下移一页</button></div><div class="field-pair page-utilities"><button class="tiny" id="duplicate">复制此页</button><button class="tiny danger" id="delete-page">删除此页</button></div></section></div></aside></main><div id="toast" role="status"></div><script type="module" src="/author/admin.js"></script></body></html>
