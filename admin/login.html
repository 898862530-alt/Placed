<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来过之地 · 作者登录</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.svg"></head><body style="min-height:100dvh;display:grid;place-items:center"><main style="width:min(420px,90vw);padding:38px;background:#faf9f6;border:1px solid #deded7"><h1 style="font-family:serif;font-weight:400;letter-spacing:.18em">来过之地</h1><p style="color:#777;line-height:1.8">作者工作台</p><form id="login-form" style="display:grid;gap:14px;margin-top:28px"><label>账号<input name="username" autocomplete="username" required style="display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d8d8d0;background:white"></label><label>密码<input name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d8d8d0;background:white"></label><button type="submit" style="margin-top:8px;padding:12px;border:0;background:#363f34;color:white">登录</button></form><p id="message" role="status" style="min-height:1.5em;color:#98563c"></p></main><script src="./login.js"></script></body></html>
